<div class="wrapper">
  <div class="background"></div>

  <header class="page-head">
    <h1 class="top italics">About Me</h1>
    <p class="subtitle">Explore my experience, projects, and certifications</p>
    <p class="mobile-hint">Tap a node to expand &middot; drag to pan</p>
  </header>

  <div class="tree-toolbar" role="search">
    <input id="tree-search" type="search" placeholder="Search portfolio..." aria-label="Search portfolio">
    <span id="tree-search-status" aria-live="polite"></span>
    <button id="tree-fit" type="button" aria-label="Fit the visible tree">Fit</button>
    <button id="tree-reset" type="button" aria-label="Reset tree and search">Reset</button>
  </div>

  <div id="tree-container"></div>

  <div class="instructions">
    <p class="bottom-left">[ click a node to expand/collapse ]</p>
    <p class="bottom-center">[ scroll or double-click to zoom ]</p>
    <p class="bottom-right">[ drag the background to pan &middot; click underlined labels to open links ]</p>
  </div>
</div>
